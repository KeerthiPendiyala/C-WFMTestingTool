        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Document extraction or requirement generation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "502":
          description: OpenAI returned an unavailable or invalid response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
