        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    entraBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Microsoft Entra ID JWT for protected business APIs.
  headers:
    CorrelationId:
      description: Request correlation ID accepted from the client or generated by the server.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ETag:
      description: Strong resource version used with `If-Match` for optimistic concurrency.
      schema:
        type: string
    ContentDisposition:
      description: Attachment filename for downloads.
      schema:
        type: string
    Deprecation:
      description: Present when an operation or field is deprecated.
      schema:
        type: string
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectIdQuery:
      name: projectId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SuiteId:
      name: suiteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CycleId:
      name: cycleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 25
    Sort:
      name: sort
      in: query
      required: false
      description: Repeatable sort parameter formatted as `field,asc` or `field,desc`.
      schema:
        type: array
        items:
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9]*,(asc|desc)$"
      style: form
      explode: true
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 160
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing, expired, or invalid bearer token.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            unauthorized:
              $ref: "#/components/examples/UnauthorizedProblem"
    Forbidden:
      description: Current user is not authorized. Response does not reveal whether the resource exists.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            forbidden:
              $ref: "#/components/examples/ForbiddenProblem"
    NotFoundHidden:
      description: Resource is unavailable to the current user; details are intentionally hidden.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            notFoundHidden:
              $ref: "#/components/examples/NotFoundHiddenProblem"
    ValidationProblem:
      description: Request validation failed.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            validation:
              $ref: "#/components/examples/ValidationProblem"
    Conflict:
      description: Request conflicts with current resource state or uniqueness rules.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            optimisticLock:
              $ref: "#/components/examples/OptimisticLockProblem"
    FileDownload:
      description: Authorized file download.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
        Content-Disposition:
          $ref: "#/components/headers/ContentDisposition"
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
  schemas:
    SystemStatusResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - check
        - service
        - timestamp
      properties:
        status:
          type: string
          enum:
            - UP
            - DOWN
        check:
          type: string
          enum:
            - health
            - ready
        service:
          type: string
        timestamp:
          type: string
          format: date-time
          description: UTC ISO-8601 timestamp.
    AuthSessionResponse:
      type: object
      additionalProperties: false
      required:
        - userId
        - tenantId
        - objectId
        - firstName
        - lastName
        - contactEmail
        - globalAdministrator
        - principalKey
        - globalCapabilities
        - projectPermissions
      properties:
        userId:
          type: string
          format: uuid
        tenantId:
          type: string
        objectId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        contactEmail:
          type: string
          format: email
        globalAdministrator:
          type: boolean
        principalKey:
          type: string
          description: Immutable authorization principal composed from tid plus oid.
        globalCapabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        projectPermissions:
          type: object
          description: Current database-backed permissions keyed by assigned project UUID. Administrators use their full-access override.
          additionalProperties:
            type: array
            uniqueItems: true
            items:
              $ref: "#/components/schemas/AccessPermission"
    LocalLoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          description: Environment-configured local Administrator username, normally the pre-provisioned admin contact email.
        password:
          type: string
          minLength: 1
          format: password
          description: Environment-supplied development/test password. Never committed or displayed.
    CreateUserRequest:
      type: object
      additionalProperties: false
      required:
        - firstName
        - lastName
        - email
        - password
        - confirmPassword
        - role
        - status
        - projectIds
        - suiteAssignmentIds
        - testCycleIds
        - permissions
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 120
        lastName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 200
          writeOnly: true
        confirmPassword:
          type: string
          format: password
          minLength: 10
          maxLength: 200
          writeOnly: true
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        projectIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        suiteAssignmentIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        testCycleIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AccessPermission"
    UserRole:
      type: string
      enum: [ADMINISTRATOR, TEST_MANAGER, TEST_LEAD, TEST_ANALYST]
    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName, email, role, status, projectIds, permissions]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 120
        lastName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 320
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        projectIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          description: Permission set applied to each selected project. VIEW is required.
          items:
            $ref: "#/components/schemas/AccessPermission"
        newPassword:
          type: string
          format: password
          maxLength: 200
          writeOnly: true
          description: Optional. Leave this and confirmNewPassword empty to keep the existing password.
        confirmNewPassword:
          type: string
          format: password
          maxLength: 200
          writeOnly: true
          description: Required only when newPassword is supplied.
    AccessPermission:
      type: string
      enum: [VIEW, CREATE, EDIT, EXECUTE, DELETE, APPROVE_REQUIREMENTS, MANAGE_ASSIGNMENTS]
    UserSummary:
