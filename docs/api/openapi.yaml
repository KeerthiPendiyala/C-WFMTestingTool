openapi: 3.1.0
info:
  title: UKG QA Test Management API
  version: 0.2.0
  summary: Versioned REST foundation for the UKG Test Management application.
  description: |
    `/api/v1` is the first stable REST surface. This contract defines shared API conventions and the already implemented
    auth, system, and project dashboard endpoints. Future endpoint groups are scaffolded as planned contracts through
    tags and `x-planned-endpoint-groups`; they must not be treated as implemented behavior until a path operation appears.

    All timestamps are UTC ISO-8601 date-time strings. Dates are ISO-8601 calendar dates. Enums serialize as the exact
    documented string values. Persistence entities are never exposed; all payloads are request/response DTOs.
  x-api-conventions:
    versioning:
      currentBasePath: /api/v1
      policy: New breaking changes require a new `/api/v{n}` base path. Compatible additions may be added to v1.
      deprecation: Deprecated fields or operations include `deprecated: true`, a `Deprecation` response header, and a replacement note for at least one minor release.
    resourceNaming:
      style: lower-kebab-case plural nouns
      actions: Use subresources or colon actions only for command-style operations such as `:approve` and `:generate`.
      examples:
        - /api/v1/projects/{projectId}/memberships
        - /api/v1/requirements/{requirementId}:approve
    pagination:
      syntax: `page` is zero-based, `size` is bounded, and list responses use `PageMeta`.
      defaults:
        page: 0
        size: 25
        maxSize: 200
    sorting:
      syntax: Repeated `sort` parameters formatted as `field,asc` or `field,desc`.
      stability: Server adds a deterministic tie-breaker where needed.
    filtering:
      syntax: `filter[field]=value` for equality, `filter[field][op]=value` for explicit operations.
      allowedOperators:
        - eq
        - contains
        - in
        - gte
        - lte
      rule: Unsupported filters return a validation problem.
    concurrency:
      rule: Editable resources expose an `ETag`; updates and deletes require `If-Match`.
      conflictStatus: 409
      preconditionStatus: 412
    idempotency:
      header: Idempotency-Key
      requiredFor:
        - bulk imports
        - exports
        - AI generation
        - future execution scheduling
      ttl: At least 24 hours for command deduplication.
    headers:
      correlationId: `X-Correlation-Id` is accepted on every request and returned on every response.
      contentNegotiation: APIs accept JSON unless documented otherwise and return `application/json` or `application/problem+json`.
    downloads:
      rule: Download operations authorize at request time, stream bytes, include `Content-Disposition`, and never expose raw object-storage references.
servers:
  - url: /
security:
  - entraBearer: []
tags:
  - name: System
    description: Public health/readiness endpoints.
  - name: Authentication
    description: AUTH-01 through AUTH-03 session and logout endpoints.
  - name: Projects
    description: PROJ-01 and RBAC-02/RBAC-03 project dashboard endpoints.
  - name: Memberships
    description: Planned project membership and role assignment endpoints for UI-03.
  - name: Users
    description: Administrator-only local user and access-management endpoints for UI-03.
  - name: Suites
    description: SUITE-01 reusable test-suite catalog endpoints for UI-04.
  - name: Project Suite Assignments
    description: SUITE-01 project-to-suite assignment endpoints for UI-04.
  - name: Cycles
    description: CYCLE-01 project-scoped test-cycle endpoints for UI-05.
  - name: Requirements
    description: Planned requirement creation, approval, deletion, and listing endpoints for UI-06 through UI-09.
  - name: Uploads And Generation Jobs
    description: Planned secure upload and generation-job endpoints for requirement extraction and AI generation.
  - name: Test Cases
    description: Planned requirement-linked and ad hoc test-case endpoints for UI-10, UI-11, and UI-13.
  - name: Predefined Templates And Generation
    description: Planned Phase 2 predefined template and generation endpoints for UI-12.
  - name: Exports
    description: Planned CSV/PDF/Excel export endpoints for UI-13 and reporting.
  - name: Future Execution
    description: Contract-only future execution endpoints behind feature flags.
  - name: Evidence
    description: Contract-only evidence metadata and download endpoints behind feature flags.
x-planned-endpoint-groups:
  memberships:
    status: planned
    paths:
      - /api/v1/projects/{projectId}/memberships
      - /api/v1/projects/{projectId}/memberships/{membershipId}
  suites:
    status: implemented
    paths:
      - /api/v1/suites
      - /api/v1/projects/{projectId}/suite-assignments
  cycles:
    status: implemented
    paths:
      - /api/v1/projects/{projectId}/cycles
      - /api/v1/projects/{projectId}/cycles/{cycleId}
  requirements:
    status: planned
    paths:
      - /api/v1/requirements
      - /api/v1/requirements/{requirementId}
      - /api/v1/requirements/{requirementId}:approve
  uploadsAndGenerationJobs:
    status: planned
    paths:
      - /api/v1/uploads
      - /api/v1/generation-jobs
      - /api/v1/generation-jobs/{jobId}
  testCases:
    status: planned
      paths:
      - /api/v1/test-cases
      - /api/v1/test-cases/{testCaseId}
      - /api/v1/test-cases:generate
      - /api/v1/test-cases:import-csv
      - /api/v1/test-cases/adhoc
      - /api/v1/test-cases/adhoc:import-csv
  predefinedTemplatesAndGeneration:
    status: planned
    paths:
      - /api/v1/predefined-test-case-templates
      - /api/v1/predefined-test-cases:generate
  exports:
    status: planned
    paths:
      - /api/v1/exports/test-cases
      - /api/v1/exports/{exportId}
      - /api/v1/exports/{exportId}/download
  futureExecutionAndEvidence:
    status: contract-only
    paths:
      - /api/v1/execution-runs
      - /api/v1/execution-runs/{executionRunId}
      - /api/v1/evidence-artifacts
      - /api/v1/evidence-artifacts/{evidenceArtifactId}/download
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Fast liveness health check
      security: []
      tags:
        - System
      responses:
        "200":
          description: Application is alive.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatusResponse"
  /api/v1/ready:
    get:
      operationId: getReadiness
      summary: Fast readiness check for required runtime only
      security: []
      tags:
        - System
      responses:
        "200":
          description: Application is ready to accept foundational traffic.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatusResponse"
  /api/v1/auth/me:
    get:
      operationId: getAuthenticatedSession
      summary: Resolve the current immutable Entra-bound application user
      tags:
        - Authentication
      responses:
        "200":
          description: Authenticated application user resolved from tid plus oid.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/local-login:
    post:
      operationId: localUserLogin
      summary: Development-only local user password login
      description: AUTH-03 development/test path only. Enabled only when local auth is explicit and blocked in production. Passwords for database-backed users are stored only as BCrypt hashes and successful authentication creates a server-side session; this does not replace production Entra SSO.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalLoginRequest"
            examples:
              LocalAdminLogin:
                summary: Environment-configured local Administrator credential
                value:
                  username: admin@example.test
                  password: "<supplied through environment>"
      responses:
        "200":
          description: Local user session created.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List application users for access management
      description: Administrator-only. Non-Administrators receive a generic forbidden response.
      tags:
        - Users
      responses:
        "200":
          description: Application users visible to the Administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      summary: Create a locally authenticated user with scoped access
      description: Administrator-only. Passwords are accepted only over the request body and persisted as BCrypt hashes.
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User and access assignments created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummary"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/users/{userId}:
    patch:
      operationId: updateUser
      summary: Update an application user, project access, and optional local password
      description: Administrator-only. Both password fields may be left empty to preserve the existing password. Non-Administrators receive a generic forbidden response.
      tags:
        - Users
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User profile and project access updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummary"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/auth/logout:
    post:
      operationId: observeLogout
      summary: Record observable logout before client-side Entra sign-out
      tags:
        - Authentication
      responses:
        "204":
          description: Logout observation recorded where possible.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects visible to the current user
      description: Administrators receive all same-tenant active projects; project roles receive assigned active projects only.
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: Scoped project dashboard data for UI-02A/UI-02B.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProject
      summary: Create a project
      description: RBAC-02 Administrator-only project creation.
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSummary"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/projects/{projectId}:
    get:
      operationId: getProject
      summary: Get a project visible to the current user
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project details and project-scoped capabilities.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundHidden"
  /api/v1/projects/{projectId}/memberships:
    get:
      operationId: listProjectMemberships
      summary: List project memberships visible to a project user manager
      description: RBAC-03 requires MANAGE_ASSIGNMENTS on the requested project. Responses never include unrelated project memberships.
      tags:
        - Project Memberships
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project-scoped memberships.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMembershipListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: addProjectMembership
      summary: Pre-provision a user and assign one project role
      description: RBAC-03 requires MANAGE_ASSIGNMENTS on the requested project. Existing Entra bindings are never overwritten.
      tags:
        - Project Memberships
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddProjectMemberRequest"
      responses:
        "201":
          description: Membership created and invitation event recorded.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMembershipSummary"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/projects/{projectId}/memberships/{membershipId}:
    patch:
      operationId: changeProjectMembershipRole
      summary: Change a project member role
      description: RBAC-03 requires MANAGE_ASSIGNMENTS on the requested project. Last effective project manager removal requires an Administrator override.
      tags:
        - Project Memberships
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/MembershipId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeProjectMemberRoleRequest"
      responses:
        "200":
          description: Role changed.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMembershipSummary"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: disableProjectMembership
      summary: Disable a project membership
      description: RBAC-03 requires MANAGE_ASSIGNMENTS on the requested project. Disables membership without deleting the user or Entra binding.
      tags:
        - Project Memberships
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/MembershipId"
        - name: allowLastManagerOverride
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "204":
          description: Membership disabled.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/suites:
    get:
      operationId: listSuites
      summary: List reusable suite catalog entries
      description: SUITE-01 reusable suite catalog for a project on which the user has VIEW permission.
      tags:
        - Suites
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
      responses:
        "200":
          description: Available reusable suites.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuiteCatalogResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/suites/{suiteId}:
    patch:
      operationId: updateSuite
      summary: Edit a reusable test suite
      description: SUITE-01 requires EDIT permission for the supplied projectId query parameter.
      tags:
        - Suites
      parameters:
        - $ref: "#/components/parameters/SuiteId"
        - $ref: "#/components/parameters/ProjectIdQuery"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSuiteRequest"
      responses:
        "200":
          description: Suite updated.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuiteCatalogSummary"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteSuite
      summary: Delete a reusable test suite
      description: SUITE-01 deletes the selected project assignment when unreferenced, and deletes the reusable suite only when this is its final project assignment; requires DELETE permission for the supplied projectId query parameter.
      tags:
        - Suites
      parameters:
        - $ref: "#/components/parameters/SuiteId"
        - $ref: "#/components/parameters/ProjectIdQuery"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Suite soft-deleted.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/projects/{projectId}/suite-assignments:
    get:
      operationId: listProjectSuiteAssignments
      summary: List suites assigned to a project
      description: SUITE-01 project-scoped dependent selector. Requires project view access.
      tags:
        - Project Suite Assignments
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project-scoped suite assignments.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSuiteAssignmentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: assignSuiteToProject
      summary: Create or assign a suite to a project
      description: SUITE-01 requires CREATE permission on the requested project.
      tags:
        - Project Suite Assignments
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignSuiteRequest"
      responses:
        "201":
          description: Suite assigned.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSuiteAssignmentSummary"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/projects/{projectId}/suite-assignments/{assignmentId}:
    delete:
      operationId: unassignSuiteFromProject
      summary: Unassign a suite from a project
      description: SUITE-01 requires MANAGE_ASSIGNMENTS and blocks unassignment when requirements or test cases reference the assignment.
      tags:
        - Project Suite Assignments
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/AssignmentId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Suite assignment soft-deleted.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/projects/{projectId}/cycles:
    get:
      operationId: listProjectCycles
      summary: List cycles for a project
      description: CYCLE-01 project-scoped dependent selector. Requires project view access.
      tags:
        - Cycles
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project-scoped cycles.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCycleListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createProjectCycle
      summary: Create a project test cycle
      description: CYCLE-01 requires CREATE permission on the requested project.
      tags:
        - Cycles
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCycleRequest"
      responses:
        "201":
          description: Cycle created.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCycleSummary"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/projects/{projectId}/cycles/{cycleId}:
    patch:
      operationId: updateProjectCycle
      summary: Edit a project test cycle
      description: CYCLE-01 requires EDIT permission on the requested project.
      tags:
        - Cycles
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CycleId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCycleRequest"
      responses:
        "200":
          description: Cycle updated.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCycleSummary"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteProjectCycle
      summary: Delete a project test cycle
      description: CYCLE-01 requires DELETE permission and blocks deletion when requirements or test cases reference the cycle.
      tags:
        - Cycles
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CycleId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Cycle soft-deleted.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
