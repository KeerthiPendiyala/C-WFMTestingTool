server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${PORT:8080}
  forward-headers-strategy: framework
  max-http-request-header-size: ${SERVER_MAX_HTTP_REQUEST_HEADER_SIZE:16KB}
  tomcat:
    max-http-form-post-size: ${SERVER_MAX_HTTP_FORM_POST_SIZE:2MB}

spring:
  application:
    name: ukg-qa-test-management
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ukgqtm}
    username: ${DATABASE_USERNAME:ukgqtm}
    password: ${DATABASE_PASSWORD:ukgqtm}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:25MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:30MB}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5.6-sol}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      connect-timeout: ${OPENAI_CONNECT_TIMEOUT:10s}
      read-timeout: ${OPENAI_READ_TIMEOUT:3m}
      max-extracted-characters: ${AI_MAX_EXTRACTED_CHARACTERS:500000}
  api:
    cors:
      allowed-origins: ${API_CORS_ALLOWED_ORIGINS:}
  security:
    oauth2-resource-server-enabled: ${OAUTH2_RESOURCE_SERVER_ENABLED:false}
    production: ${APP_SECURITY_PRODUCTION:false}
    local-auth-enabled: ${LOCAL_AUTH_ENABLED:false}
    local-admin:
      username: ${LOCAL_ADMIN_USERNAME:}
      password: ${LOCAL_ADMIN_PASSWORD:}
      password-hash: ${LOCAL_ADMIN_PASSWORD_HASH:}
      tenant-id: ${LOCAL_ADMIN_TENANT_ID:dev-tenant}
      object-id: ${LOCAL_ADMIN_OBJECT_ID:local-admin}
    entra:
      allowed-tenants: ${ENTRA_ALLOWED_TENANTS:}
      audiences: ${ENTRA_AUDIENCES:}
      issuer-host: ${ENTRA_ISSUER_HOST:https://login.microsoftonline.com}
      jwk-set-uri: ${ENTRA_JWK_SET_URI:}
    bootstrap-admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      normalized-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    development-admin:
      enabled: ${DEV_ADMIN_ENABLED:false}
      email: ${DEV_ADMIN_EMAIL:}
      password: ${DEV_ADMIN_PASSWORD:}
      password-hash: ${DEV_ADMIN_PASSWORD_HASH:}
      first-name: ${DEV_ADMIN_FIRST_NAME:Development}
      last-name: ${DEV_ADMIN_LAST_NAME:Administrator}
      tenant-id: ${DEV_ADMIN_TENANT_ID:dev-tenant}

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
